name: Windows release candidate

on:
  push:
    branches:
      - "agent/upstream-v1.0.0"

permissions:
  contents: read

concurrency:
  group: windows-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Verify release-candidate version
        shell: pwsh
        run: |
          $expectedVersion = '1.0.1'
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          if ($packageVersion -ne $expectedVersion) {
            throw "package.json version $packageVersion does not match tag version $expectedVersion"
          }

          if ($tauriVersion -ne $expectedVersion) {
            throw "tauri.conf.json version $tauriVersion does not match tag version $expectedVersion"
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify and checksum installer
        id: installer
        shell: pwsh
        run: |
          $expectedVersion = '1.0.1'
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)

          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }

          $installer = $installers[0]
          if ($installer.Name -notmatch [regex]::Escape($expectedVersion)) {
            throw "Installer $($installer.Name) does not contain version $expectedVersion"
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" |
            Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding ascii

          "filename=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Scratch-v1.0.1-windows-x64-rc
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
